<!-- src/pages/services.html -->
<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Services — George Buchan Consulting</title>
  <meta name="description"
    content="Psychology teaching, organisational workshops, and individual reflection & guidance in Switzerland.">
  <link rel="stylesheet" href="/george-buchan-consulting/src/css/output.css">
</head>

<body class="bg-background text-foreground">

  <div id="header-container"></div>

  <main>
    <!-- PAGE HERO -->
    <section class="relative pt-40 pb-20 overflow-hidden bg-gradient-soft">
      <div class="blur-blob bg-primary/25 w-[500px] h-[500px] -top-32 -left-40 animate-float"></div>
      <div class="blur-blob bg-accent/20 w-[420px] h-[420px] -bottom-32 -right-20 animate-float"
        style="animation-delay: 2s"></div>
      <div class="relative max-w-6xl mx-auto px-6 lg:px-10 grid lg:grid-cols-[1.2fr,1fr] gap-12 items-center text-left">
        <div>
          <h1 class="font-display text-5xl lg:text-6xl font-bold tracking-tight animate-fade-in"
            data-i18n="services-title"></h1>
          <p class="mt-6 text-lg text-muted-foreground leading-relaxed" data-i18n="services-sub"></p>
        </div>
        <div class="rounded-3xl overflow-hidden shadow-glow bg-card">
          <img data-i18n-img="myservices" data-img-fr="src/assets/images/my-services-fr.webp"
            data-img-en="src/assets/images/my-services-en.webp" src="" alt="">
        </div>
      </div>
    </section>

    <!-- SERVICE 1 : Teacher -->
    <section class="py-20">
      <div class="max-w-7xl mx-auto px-6 lg:px-10 grid lg:grid-cols-2 gap-12 items-center">
        <div class="reveal">
          <div class="rounded-3xl overflow-hidden shadow-soft">
            <img src="src/assets/images/psych-teacher.webp" alt="" class="w-full aspect-[4/3] object-cover">
          </div>
        </div>
        <div class="reveal">
          <h2 class="font-display text-3xl lg:text-4xl font-bold text-foreground" data-i18n="c1-title"></h2>
          <div class="mt-6 space-y-4 text-base text-foreground/80 leading-relaxed">
            <p data-i18n="c1-body1"></p>
            <p data-i18n="c1-body2"></p>
            <p data-i18n="c1-body3"></p>
            <p data-i18n="c1-body4"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- SERVICE 2 : Organisations -->
    <section class="py-20">
      <div class="max-w-7xl mx-auto px-6 lg:px-10 grid lg:grid-cols-2 gap-12 items-center">
        <div class="reveal lg:order-2">
          <div class="rounded-3xl overflow-hidden shadow-soft">
            <img src="src/assets/images/organisations.webp" alt="" class="w-full aspect-[4/3] object-cover">
          </div>
        </div>
        <div class="reveal lg:order-1">
          <h2 class="font-display text-3xl lg:text-4xl font-bold text-foreground" data-i18n="c2-title"></h2>
          <div class="mt-6 space-y-4 text-base text-foreground/80 leading-relaxed">
            <p data-i18n="c2-body1"></p>
            <p data-i18n="c2-body2"></p>
            <p data-i18n="c2-body3"></p>
            <p class="font-display text-lg font-semibold text-primary italic" data-i18n="c2-body4"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- SERVICE 3 : Individuel -->
    <section class="py-20">
      <div class="max-w-7xl mx-auto px-6 lg:px-10 grid lg:grid-cols-2 gap-12 items-center">
        <div class="reveal">
          <div class="rounded-3xl overflow-hidden shadow-soft">
            <img data-i18n-img="individuals" data-img-fr="src/assets/images/individuals-fr.webp"
              data-img-en="src/assets/images/individuals-en.webp" src="" alt="">
          </div>
        </div>
        <div class="reveal">
          <h2 class="font-display text-3xl lg:text-4xl font-bold text-foreground" data-i18n="c3-title"></h2>
          <div class="mt-6 space-y-4 text-base text-foreground/80 leading-relaxed">
            <p data-i18n="c3-body1"></p>
            <p data-i18n="c3-body2"></p>
            <p data-i18n="c3-body3"></p>
            <p data-i18n="c3-body4"></p>
          </div>
          <div class="mt-6 p-6 rounded-2xl bg-secondary border border-border/60">
            <p class="font-display text-lg font-semibold text-foreground" data-i18n="c3-expat-title"></p>
            <p class="mt-3 text-sm text-foreground/80 leading-relaxed" data-i18n="c3-expat-text"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- WHAT I DO -->
    <section class="py-16">
      <div class="max-w-5xl mx-auto px-6 lg:px-10">
        <div class="reveal rounded-3xl overflow-hidden shadow-soft border border-border/60 bg-card">
          <img data-i18n-img="whatido" data-img-fr="src/assets/images/what-i-do-fr.webp"
            data-img-en="src/assets/images/what-i-do-en.webp" src="" alt="">
        </div>
      </div>
    </section>

    <!-- VOLUNTARY -->
    <section class="py-16">
      <div class="max-w-4xl mx-auto px-6 lg:px-10">
        <div class="reveal p-8 lg:p-12 rounded-3xl bg-card border border-border/60 shadow-soft text-center">
          <div
            class="w-14 h-14 rounded-full bg-gradient-hero text-primary-foreground mx-auto flex items-center justify-center mb-5">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path
                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
            </svg>
          </div>
          <h3 class="font-display text-2xl lg:text-3xl font-bold" data-i18n="vol-title"></h3>
          <p class="mt-5 text-base text-muted-foreground leading-relaxed max-w-2xl mx-auto" data-i18n="vol-text"></p>
        </div>
      </div>
    </section>

    <!-- NOTICE -->
    <section class="py-8">
      <div class="max-w-4xl mx-auto px-6 lg:px-10">
        <div
          class="reveal p-6 lg:p-8 rounded-2xl border border-primary/25 bg-[color-mix(in_oklab,var(--color-deep-green)_5%,var(--color-background))]">
          <p class="text-xs uppercase tracking-[0.25em] text-primary font-semibold mb-2" data-i18n="notice-title"></p>
          <p class="text-sm lg:text-base text-foreground/80 leading-relaxed italic" data-i18n="notice-text"></p>
        </div>
      </div>
    </section>

    <!-- WHY -->
    <section class="py-28 bg-gradient-soft">
      <div class="max-w-7xl mx-auto px-6 lg:px-10">
        <div class="reveal">
          <h2 class="text-center font-display text-4xl lg:text-5xl font-bold mb-16" data-i18n="why-title"></h2>
        </div>
        <div class="grid md:grid-cols-3 gap-8">
          <div
            class="reveal h-full rounded-2xl bg-card border border-border/60 hover:shadow-glow transition overflow-hidden">
            <img data-i18n-img="academic" data-img-fr="src/assets/images/academic-foundation-fr.webp"
              data-img-en="src/assets/images/academic-foundation-en.webp" src="" alt="">
          </div>
          <div
            class="reveal h-full rounded-2xl bg-card border border-border/60 hover:shadow-glow transition overflow-hidden">
            <img data-i18n-img="critical" data-img-fr="src/assets/images/critical-analysis-fr.webp"
              data-img-en="src/assets/images/critical-analysis-en.webp" src="" alt="">
          </div>
          <div
            class="reveal h-full rounded-2xl bg-card border border-border/60 hover:shadow-glow transition overflow-hidden">
            <img data-i18n-img="integrity" data-img-fr="src/assets/images/pro-integrity-fr.webp"
              data-img-en="src/assets/images/pro-integrity-en.webp" src="" alt="">
          </div>
        </div>
      </div>
    </section>

    <!-- PHILOSOPHY -->
    <section class="py-28">
      <div class="max-w-6xl mx-auto px-6 lg:px-10">
        <div class="reveal">
          <h2 class="text-center font-display text-4xl lg:text-5xl font-bold mb-14" data-i18n="phil-title"></h2>
        </div>
        <div class="grid md:grid-cols-2 gap-8">
          <div class="reveal rounded-3xl overflow-hidden bg-card border border-border/60 shadow-soft">
            <img src="src/assets/images/krishnamurti.webp" alt="" class="w-full aspect-[4/5] object-cover">
            <div class="p-8">
              <p class="font-display text-lg lg:text-xl italic leading-relaxed" data-i18n="phil-k"></p>
              <p class="mt-4 text-sm uppercase tracking-[0.2em] text-muted-foreground" data-i18n="phil-kAuthor"></p>
            </div>
          </div>
          <div class="reveal rounded-3xl overflow-hidden bg-card border border-border/60 shadow-soft">
            <img src="src/assets/images/coffee.webp" alt="" class="w-full aspect-[4/5] object-cover">
            <div class="p-8">
              <p class="font-display text-lg lg:text-xl italic leading-relaxed" data-i18n="phil-coffee"></p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- RATES -->
    <section class="py-20 bg-gradient-soft">
      <div class="max-w-4xl mx-auto px-6 lg:px-10">
        <div
          class="reveal p-10 lg:p-14 rounded-3xl bg-gradient-hero text-primary-foreground shadow-glow relative overflow-hidden">
          <div class="blur-blob bg-white/20 w-72 h-72 -top-20 -right-20"></div>
          <div class="relative">
            <p class="text-xs uppercase tracking-[0.25em] opacity-80" data-i18n="rates-title"></p>
            <div class="mt-5 space-y-4 text-base lg:text-lg leading-relaxed">
              <p data-i18n="rates-p1"></p>
              <p data-i18n="rates-p2"></p>
              <p class="italic opacity-90" data-i18n="rates-p3"></p>
            </div>
            <a href="contact.html" data-link
              class="mt-8 inline-flex items-center gap-2 rounded-full bg-primary-foreground text-primary px-7 py-3.5 font-semibold hover:scale-[1.03] transition">
              <span data-i18n="cta-contact"></span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14M12 5l7 7-7 7" />
              </svg>
            </a>
          </div>
        </div>
      </div>
    </section>

    <!-- FAQ -->
    <section class="py-24">
      <div class="max-w-4xl mx-auto px-6 lg:px-10">
        <div class="reveal text-center mb-12">
          <p class="text-xs uppercase tracking-[0.2em] text-primary font-semibold">FAQ</p>
          <h2 class="mt-3 font-display text-4xl font-bold" data-i18n="faq-title"></h2>
        </div>
        <div class="space-y-3" id="faq-container"></div>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script type="module" src="/george-buchan-consulting/src/js/main.js"></script>
</body>

</html>
