<!-- src/pages/contact.html -->
<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — George Buchan Consulting</title>
  <meta name="description"
    content="Get in touch to start a conversation. Individual, organisational or teaching enquiries welcome.">

  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="180x180" href="../../apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../../favicon-16x16.png">
  <link rel="manifest" href="../../site.webmanifest">

  <link rel="stylesheet" href="../css/output.css">
</head>

<body class="bg-background text-foreground">

  <div id="header-container"></div>

  <main>
    <!-- HERO -->
    <section class="relative pt-32 pb-8 overflow-hidden bg-gradient-soft">
      <div class="blur-blob bg-primary/25 w-[500px] h-[500px] -top-32 -left-40 animate-float"></div>
      <div class="blur-blob bg-accent/20 w-[420px] h-[420px] -bottom-32 -right-20 animate-float"
        style="animation-delay: 2s"></div>
      <div class="relative max-w-3xl mx-auto px-6 lg:px-10 text-center">
        <div
          class="mx-auto w-[200px] h-[200px] lg:w-[240px] lg:h-[240px] rounded-full overflow-hidden shadow-glow ring-4 ring-background">
          <img src="../assets/images/contact.webp" alt="George Buchan"
            class="w-full h-full object-cover object-[center_25%]">
        </div>
        <h1 class="mt-8 font-display text-5xl lg:text-6xl font-bold tracking-tight" data-i18n="contact-title"></h1>
        <div class="mt-6 space-y-4 text-base lg:text-lg text-muted-foreground leading-relaxed">
          <p data-i18n="contact-p1"></p>
          <p data-i18n="contact-p2"></p>
          <p>
            <span data-i18n="contact-p3"></span>
            <a href="tel:+41798593888" class="text-primary font-semibold hover:underline">+41 (0) 79 859 38 88</a>
          </p>
        </div>
      </div>
    </section>

    <!-- INTERVIEW INFOGRAPHIC -->
    <section class="pb-4">
      <div class="max-w-3xl mx-auto px-6 lg:px-10">
        <div class="reveal mt-6">
          <div class="rounded-3xl overflow-hidden shadow-soft border border-border/60 bg-card">
            <img data-i18n-img="interview" data-img-fr="../assets/images/interview-fr.webp"
              data-img-en="../assets/images/interview-en.webp" src="../assets/images/interview-fr.webp" alt=""
              class="w-full h-auto">
          </div>
        </div>
      </div>
    </section>

    <!-- FORMULAIRE + INFOS -->
    <section class="py-16">
      <div class="max-w-6xl mx-auto px-6 lg:px-10 grid lg:grid-cols-[1.2fr,1fr] gap-10">

        <!-- Formulaire -->
        <div class="reveal">
          <form id="contact-form" class="p-8 lg:p-10 rounded-3xl bg-card border border-border/60 shadow-soft">
            <!-- État envoyé -->
            <div id="form-sent" class="text-center py-10 hidden">
              <div
                class="w-16 h-16 rounded-full bg-primary text-primary-foreground mx-auto flex items-center justify-center">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12" />
                </svg>
              </div>
              <p class="mt-6 font-display text-xl" data-i18n="contact-confirm"></p>
            </div>

            <!-- Formulaire -->
            <div id="form-fields" class="space-y-5">
              <label class="block">
                <span class="text-xs uppercase tracking-wider text-muted-foreground font-semibold"
                  data-i18n="contact-name"></span>
                <div class="mt-2">
                  <input required
                    class="w-full px-4 py-3 rounded-xl bg-background border border-border focus:border-primary focus:ring-2 focus:ring-primary/15 focus:outline-none text-sm transition">
                </div>
              </label>
              <label class="block">
                <span class="text-xs uppercase tracking-wider text-muted-foreground font-semibold"
                  data-i18n="contact-email"></span>
                <div class="mt-2">
                  <input required type="email"
                    class="w-full px-4 py-3 rounded-xl bg-background border border-border focus:border-primary focus:ring-2 focus:ring-primary/15 focus:outline-none text-sm transition">
                </div>
              </label>
              <label class="block">
                <span class="text-xs uppercase tracking-wider text-muted-foreground font-semibold"
                  data-i18n="contact-subject"></span>
                <div class="mt-2">
                  <select
                    class="w-full px-4 py-3 rounded-xl bg-background border border-border focus:border-primary focus:ring-2 focus:ring-primary/15 focus:outline-none text-sm transition">
                    <option data-i18n="contact-subj-individual"></option>
                    <option data-i18n="contact-subj-corporate"></option>
                    <option data-i18n="contact-subj-teaching"></option>
                    <option data-i18n="contact-subj-expat"></option>
                    <option data-i18n="contact-subj-other"></option>
                  </select>
                </div>
              </label>
              <label class="block">
                <span class="text-xs uppercase tracking-wider text-muted-foreground font-semibold"
                  data-i18n="contact-message"></span>
                <div class="mt-2">
                  <textarea required rows="5"
                    class="w-full px-4 py-3 rounded-xl bg-background border border-border focus:border-primary focus:ring-2 focus:ring-primary/15 focus:outline-none text-sm transition"></textarea>
                </div>
              </label>
              <button type="submit"
                class="w-full inline-flex items-center justify-center gap-2 rounded-full bg-gradient-hero text-primary-foreground py-4 font-semibold shadow-soft hover:scale-[1.01] hover:shadow-glow transition disabled:opacity-60">
                <span id="send-btn-text" data-i18n="cta-send"></span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <line x1="22" y1="2" x2="11" y2="13" />
                  <polygon points="22 2 15 22 11 13 2 9 22 2" />
                </svg>
              </button>
            </div>
          </form>
        </div>

        <!-- Infos contact -->
        <div class="reveal" data-delay="120">
          <div class="space-y-6">
            <div class="p-6 rounded-2xl bg-card border border-border/60">
              <p class="text-xs uppercase tracking-[0.2em] text-primary font-semibold" data-i18n="contact-info"></p>
              <ul class="mt-4 space-y-3 text-sm">
                <li class="flex items-center gap-3">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" class="text-primary shrink-0">
                    <path
                      d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
                  </svg>
                  <a href="tel:+41798593888" class="hover:text-primary transition">+41 (0) 79 859 38 88</a>
                </li>
                <li class="flex items-center gap-3">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" class="text-primary shrink-0">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                    <polyline points="22,6 12,13 2,6" />
                  </svg>
                  <a href="mailto:george@gbcwellbeing.com"
                    class="hover:text-primary transition">george@gbcwellbeing.com</a>
                </li>
                <li class="flex items-center gap-3">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" class="text-primary shrink-0">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                    <polyline points="22,6 12,13 2,6" />
                  </svg>
                  <a href="www.linkedin.com/in/george-buchan-225a2b33" class="hover:text-primary transition">LinkedIn
                    George Buchan</a>
                </li>
                <li class="flex items-center gap-3">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" class="text-primary shrink-0">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                    <circle cx="12" cy="10" r="3" />
                  </svg>
                  <span data-i18n="contact-location"></span>
                </li>
              </ul>
            </div>
            <div class="p-7 rounded-2xl bg-gradient-hero text-primary-foreground text-center shadow-glow">
              <p class="font-display text-xl leading-snug" data-i18n="contact-cta"></p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script type="module" src="../js/main.js"></script>
</body>

</html>
