<!-- src/pages/perspectiv.html -->
<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insights — George Buchan Consulting</title>
  <meta name="description"
    content="Videos, reflections, and articles on psychology, identity, meaning and everyday wellbeing.">
  <link rel="stylesheet" href="/george-buchan-consulting/src/css/output.css">
</head>

<body class="bg-background text-foreground">

  <div id="header-container"></div>

  <main>
    <!-- PAGE HERO -->
    <section class="relative pt-40 pb-16 overflow-hidden bg-gradient-soft">
      <div class="blur-blob bg-primary/25 w-[500px] h-[500px] -top-32 -left-40 animate-float"></div>
      <div class="blur-blob bg-accent/20 w-[420px] h-[420px] -bottom-32 -right-20 animate-float"
        style="animation-delay: 2s"></div>
      <div class="relative max-w-4xl mx-auto px-6 lg:px-10 text-center">
        <h1 class="font-display text-5xl lg:text-6xl font-bold" data-i18n="ins-title"></h1>
        <p class="mt-6 text-lg text-muted-foreground" data-i18n="ins-sub"></p>
      </div>
    </section>

    <!-- YOUTUBE VIDEOS -->
    <section class="py-20">
      <div class="max-w-7xl mx-auto px-6 lg:px-10">
        <div class="reveal">
          <div class="flex flex-wrap items-end justify-between gap-4 mb-10">
            <div>
              <p class="text-xs uppercase tracking-[0.25em] text-primary font-semibold">YouTube</p>
              <h2 class="mt-2 font-display text-3xl lg:text-4xl font-bold" data-i18n="ins-videos"></h2>
              <p class="mt-2 text-muted-foreground max-w-xl" data-i18n="ins-videosSub"></p>
            </div>
            <a href="https://www.youtube.com/@AuthenticSelves" target="_blank" rel="noopener noreferrer"
              class="inline-flex items-center gap-2 rounded-full border border-border hover:border-primary hover:text-primary transition px-5 py-2.5 text-sm font-semibold">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path
                  d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29.94 29.94 0 0 0 1 12a29.94 29.94 0 0 0 .46 5.58 2.78 2.78 0 0 0 1.94 2C5.12 20 12 20 12 20s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2A29.94 29.94 0 0 0 23 12a29.94 29.94 0 0 0-.46-5.58z" />
                <polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02" />
              </svg>
              @AuthenticSelves
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                <polyline points="15 3 21 3 21 9" />
                <line x1="10" y1="14" x2="21" y2="3" />
              </svg>
            </a>
          </div>
        </div>
        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
          <!-- Vidéo 1 -->
          <div class="reveal">
            <div
              class="rounded-2xl overflow-hidden bg-card border border-border/60 shadow-soft hover:shadow-glow transition">
              <div class="aspect-video bg-foreground/5">
                <iframe class="w-full h-full" src="https://www.youtube.com/embed/pWpeTQB8cuc?rel=0&modestbranding=1"
                  title="Vidéo 5" loading="lazy"
                  allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                  allowfullscreen></iframe>
              </div>
              <div class="p-5">
                <h3 class="font-display text-base font-semibold leading-snug">Authentic Selves — Introduction</h3>
              </div>
            </div>
          </div>
          <!-- Vidéo 2 -->
          <div class="reveal" data-delay="100">
            <div
              class="rounded-2xl overflow-hidden bg-card border border-border/60 shadow-soft hover:shadow-glow transition">
              <div class="aspect-video bg-foreground/5">
                <iframe class="w-full h-full" src="https://www.youtube.com/embed/0-zzBQcMocM?rel=0&modestbranding=1"
                  title="Vidéo 1" loading="lazy"
                  allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                  allowfullscreen></iframe>
              </div>
              <div class="p-5">
                <h3 class="font-display text-base font-semibold leading-snug">Reflection & Presence</h3>
              </div>
            </div>
          </div>
          <!-- Vidéo 3 -->
          <div class="reveal" data-delay="200">
            <div
              class="rounded-2xl overflow-hidden bg-card border border-border/60 shadow-soft hover:shadow-glow transition">
              <div class="aspect-video bg-foreground/5">
                <iframe class="w-full h-full" src="https://www.youtube.com/embed/avd7GM_4EXM?rel=0&modestbranding=1"
                  title="Vidéo 2" loading="lazy"
                  allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                  allowfullscreen></iframe>
              </div>
              <div class="p-5">
                <h3 class="font-display text-base font-semibold leading-snug">Wellbeing in Everyday Life</h3>
              </div>
            </div>
          </div>
          <!-- Vidéo 4 -->
          <div class="reveal" data-delay="200">
            <div
              class="rounded-2xl overflow-hidden bg-card border border-border/60 shadow-soft hover:shadow-glow transition">
              <div class="aspect-video bg-foreground/5">
                <iframe class="w-full h-full" src="https://www.youtube.com/embed/bhPBzaMxM6Y?rel=0&modestbranding=1"
                  title="Vidéo 4" loading="lazy"
                  allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                  allowfullscreen></iframe>
              </div>
              <div class="p-5">
                <h3 class="font-display text-base font-semibold leading-snug">Wellbeing in Everyday Life</h3>
              </div>
            </div>
          </div>
          <!-- Vidéo 5 -->
          <div class="reveal" data-delay="200">
            <div
              class="rounded-2xl overflow-hidden bg-card border border-border/60 shadow-soft hover:shadow-glow transition">
              <div class="aspect-video bg-foreground/5">
                <iframe class="w-full h-full" src="https://www.youtube.com/embed/q-BXMBKklO4?rel=0&modestbranding=1"
                  title="Vidéo 3" loading="lazy"
                  allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                  allowfullscreen></iframe>
              </div>
              <div class="p-5">
                <h3 class="font-display text-base font-semibold leading-snug">Wellbeing in Everyday Life</h3>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- PODCAST -->
    <section class="py-12">
      <div class="max-w-4xl mx-auto px-6 lg:px-10">
        <div class="reveal">
          <div
            class="relative overflow-hidden p-10 lg:p-14 rounded-3xl bg-gradient-hero text-primary-foreground shadow-glow text-center">
            <div class="blur-blob bg-white/15 w-72 h-72 -top-20 -right-20"></div>
            <svg class="mx-auto mb-4" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z" />
              <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
              <line x1="12" y1="19" x2="12" y2="22" />
            </svg>
            <p class="text-xs uppercase tracking-[0.3em] opacity-80" data-i18n="ins-podcast-title"></p>
            <h3 class="mt-4 font-display text-2xl lg:text-3xl" data-i18n="ins-podcast-text"></h3>
          </div>
        </div>
      </div>
    </section>

    <!-- ARTICLES -->
    <section class="py-20 bg-gradient-soft">
      <div class="max-w-7xl mx-auto px-6 lg:px-10">
        <div class="reveal">
          <h2 class="font-display text-3xl lg:text-4xl font-bold mb-10" data-i18n="ins-articles"></h2>
        </div>
        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6" id="articles-container">
          <!-- Les articles sont générés par JavaScript -->
        </div>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script type="module" src="/george-buchan-consulting/src/js/main.js"></script>
</body>

</html>
