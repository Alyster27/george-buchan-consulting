<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How I Work — George Buchan Consulting</title>
  <meta name="description"
    content="A six-step reflective approach: understand, analyse, plan, agree, apply, reflect & adapt.">

  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="180x180" href="../../apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../../favicon-16x16.png">
  <link rel="manifest" href="../../site.webmanifest">

  <link rel="stylesheet" href="../css/output.css">
</head>

<body class="bg-background text-foreground">

  <div id="header-container"></div>

  <main>
    <!-- PAGE HERO -->
    <section class="relative pt-40 pb-16 overflow-hidden bg-gradient-soft">
      <div class="blur-blob bg-primary/25 w-[500px] h-[500px] -top-32 -left-40 animate-float"></div>
      <div class="blur-blob bg-accent/20 w-[420px] h-[420px] -bottom-32 -right-20 animate-float"
        style="animation-delay: 2s"></div>
      <div class="relative max-w-4xl mx-auto px-6 lg:px-10 text-center">
        <h1 class="font-display text-5xl lg:text-6xl font-bold tracking-tight" data-i18n="method-title"></h1>
      </div>
    </section>

    <!-- INTRO + IMAGE -->
    <section class="py-20">
      <div class="max-w-6xl mx-auto px-6 lg:px-10">
        <div class="reveal">
          <div class="grid lg:grid-cols-2 gap-10 items-center">
            <div class="p-8 lg:p-10 rounded-3xl bg-card border border-border/60 shadow-soft">
              <p class="text-base lg:text-lg text-foreground/85 leading-relaxed" data-i18n="method-intro"></p>
            </div>
            <div class="rounded-3xl overflow-hidden shadow-soft border border-border/60 bg-card">
              <img data-i18n-img="how-i-work" data-img-fr="../assets/images/how-i-work-fr.webp"
                data-img-en="../assets/images/how-i-work-en.webp" src="../assets/images/how-i-work-fr.webp" alt=""
                class="w-full h-auto">
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 6 ÉTAPES -->
    <section class="pb-32">
      <div class="max-w-4xl mx-auto px-6 lg:px-10 relative">
        <div
          class="absolute left-9 lg:left-12 top-4 bottom-4 w-px bg-gradient-to-b from-primary via-accent to-transparent hidden sm:block">
        </div>
        <div class="space-y-8">

          <!-- Étape 1 -->
          <div class="reveal">
            <div class="relative flex gap-6 sm:gap-8 items-start">
              <div class="relative shrink-0">
                <div
                  class="w-[72px] h-[72px] lg:w-24 lg:h-24 rounded-2xl bg-gradient-hero text-primary-foreground flex flex-col items-center justify-center shadow-glow">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8" />
                    <path d="m21 21-4.3-4.3" />
                  </svg>
                  <span class="mt-1 text-[10px] uppercase tracking-widest opacity-80">01</span>
                </div>
              </div>
              <div class="flex-1 pt-2">
                <h3 class="font-display text-2xl font-semibold text-foreground" data-i18n="m-s1-title"></h3>
                <p class="mt-3 text-muted-foreground leading-relaxed" data-i18n="m-s1-text"></p>
              </div>
            </div>
          </div>

          <!-- Étape 2 -->
          <div class="reveal">
            <div class="relative flex gap-6 sm:gap-8 items-start">
              <div class="relative shrink-0">
                <div
                  class="w-[72px] h-[72px] lg:w-24 lg:h-24 rounded-2xl bg-gradient-hero text-primary-foreground flex flex-col items-center justify-center shadow-glow">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 3v18h18" />
                    <path d="M18 17V9" />
                    <path d="M13 17V5" />
                    <path d="M8 17v-3" />
                  </svg>
                  <span class="mt-1 text-[10px] uppercase tracking-widest opacity-80">02</span>
                </div>
              </div>
              <div class="flex-1 pt-2">
                <h3 class="font-display text-2xl font-semibold text-foreground" data-i18n="m-s2-title"></h3>
                <p class="mt-3 text-muted-foreground leading-relaxed" data-i18n="m-s2-text"></p>
              </div>
            </div>
          </div>

          <!-- Étape 3 -->
          <div class="reveal">
            <div class="relative flex gap-6 sm:gap-8 items-start">
              <div class="relative shrink-0">
                <div
                  class="w-[72px] h-[72px] lg:w-24 lg:h-24 rounded-2xl bg-gradient-hero text-primary-foreground flex flex-col items-center justify-center shadow-glow">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" />
                  </svg>
                  <span class="mt-1 text-[10px] uppercase tracking-widest opacity-80">03</span>
                </div>
              </div>
              <div class="flex-1 pt-2">
                <h3 class="font-display text-2xl font-semibold text-foreground" data-i18n="m-s3-title"></h3>
                <p class="mt-3 text-muted-foreground leading-relaxed" data-i18n="m-s3-text"></p>
              </div>
            </div>
          </div>

          <!-- Étape 4 -->
          <div class="reveal">
            <div class="relative flex gap-6 sm:gap-8 items-start">
              <div class="relative shrink-0">
                <div
                  class="w-[72px] h-[72px] lg:w-24 lg:h-24 rounded-2xl bg-gradient-hero text-primary-foreground flex flex-col items-center justify-center shadow-glow">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 17.5a6.5 6.5 0 0 1 0-13h2a6.5 6.5 0 0 1 0 13H11z" />
                    <path d="M11 14.5a3.5 3.5 0 0 1 0-7h2a3.5 3.5 0 0 1 0 7H11z" />
                    <path d="M13 4.5v3" />
                    <path d="M11 16.5v3" />
                  </svg>
                  <span class="mt-1 text-[10px] uppercase tracking-widest opacity-80">04</span>
                </div>
              </div>
              <div class="flex-1 pt-2">
                <h3 class="font-display text-2xl font-semibold text-foreground" data-i18n="m-s4-title"></h3>
                <p class="mt-3 text-muted-foreground leading-relaxed" data-i18n="m-s4-text"></p>
              </div>
            </div>
          </div>

          <!-- Étape 5 -->
          <div class="reveal">
            <div class="relative flex gap-6 sm:gap-8 items-start">
              <div class="relative shrink-0">
                <div
                  class="w-[72px] h-[72px] lg:w-24 lg:h-24 rounded-2xl bg-gradient-hero text-primary-foreground flex flex-col items-center justify-center shadow-glow">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path
                      d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
                  </svg>
                  <span class="mt-1 text-[10px] uppercase tracking-widest opacity-80">05</span>
                </div>
              </div>
              <div class="flex-1 pt-2">
                <h3 class="font-display text-2xl font-semibold text-foreground" data-i18n="m-s5-title"></h3>
                <p class="mt-3 text-muted-foreground leading-relaxed" data-i18n="m-s5-text"></p>
              </div>
            </div>
          </div>

          <!-- Étape 6 -->
          <div class="reveal">
            <div class="relative flex gap-6 sm:gap-8 items-start">
              <div class="relative shrink-0">
                <div
                  class="w-[72px] h-[72px] lg:w-24 lg:h-24 rounded-2xl bg-gradient-hero text-primary-foreground flex flex-col items-center justify-center shadow-glow">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                    <path d="M3 3v5h5" />
                    <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
                    <path d="M16 16h5v5" />
                  </svg>
                  <span class="mt-1 text-[10px] uppercase tracking-widest opacity-80">06</span>
                </div>
              </div>
              <div class="flex-1 pt-2">
                <h3 class="font-display text-2xl font-semibold text-foreground" data-i18n="m-s6-title"></h3>
                <p class="mt-3 text-muted-foreground leading-relaxed" data-i18n="m-s6-text"></p>
              </div>
            </div>
          </div>

        </div>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script type="module" src="../js/main.js"></script>
</body>

</html>
